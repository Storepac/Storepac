  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <ellipse cx="1010" cy="120" rx="420" ry="330" fill="url(#glow)"/>

  <circle cx="1010" cy="170" r="150" fill="none" stroke="#3B82F6" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="1010" cy="170" r="228" fill="none" stroke="#3B82F6" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="1122" cy="72" r="5" fill="#3B82F6"/>
  <circle cx="905" cy="288" r="4" fill="#3B82F6" fill-opacity="0.6"/>

